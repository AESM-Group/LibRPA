<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img">
<title>Third-party source selection order</title>
<desc>For each dependency, LibRPA uses a parent target first, then an explicit source or include path, then an installed prefix for compiled libraries, and otherwise the managed source.</desc>
<style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#F8F7F3;stroke:#888780}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
.head{stroke:#73726C}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}
.c-coral>.th{fill:#712B13}
.c-coral>.ts{fill:#993C1D}
@media (prefers-color-scheme:dark){
.th{fill:#E8E6DF}
.ts{fill:#B4B2A9}
.box{fill:#2C2C2A;stroke:#888780}
.arr,.head{stroke:#9C9A92}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}
.c-teal>.th{fill:#E1F5EE}
.c-teal>.ts{fill:#9FE1CB}
.c-coral>rect{fill:#712B13;stroke:#F0997B}
.c-coral>.th{fill:#FAECE7}
.c-coral>.ts{fill:#F5C4B3}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="30" width="260" height="44" rx="8" stroke-width="0.5" class="box"/>
<text class="th" x="170" y="52" text-anchor="middle" dominant-baseline="central">Configure one dependency</text>
<line x1="170" y1="74" x2="170" y2="102" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="104" width="260" height="56" rx="8" stroke-width="0.5" class="box"/>
<text class="th" x="170" y="122" text-anchor="middle" dominant-baseline="central">Parent target defined?</text>
<text class="ts" x="170" y="142" text-anchor="middle" dominant-baseline="central">ELPA::ELPA, LibRI::LibRI, ...</text>
<g class="c-teal"><rect x="380" y="104" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="122" text-anchor="middle" dominant-baseline="central">target</text>
<text class="ts" x="510" y="142" text-anchor="middle" dominant-baseline="central">Use the parent's settings</text>
</g>
<line x1="300" y1="132" x2="378" y2="132" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="339" y="122" text-anchor="middle">yes</text>
<line x1="170" y1="160" x2="170" y2="188" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="180" y="178" text-anchor="start">no</text>
<rect x="40" y="190" width="260" height="56" rx="8" stroke-width="0.5" class="box"/>
<text class="th" x="170" y="208" text-anchor="middle" dominant-baseline="central">Explicit path given?</text>
<text class="ts" x="170" y="228" text-anchor="middle" dominant-baseline="central">*_SOURCE_DIR or *_INCLUDE_DIR</text>
<g class="c-teal"><rect x="380" y="190" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="208" text-anchor="middle" dominant-baseline="central">Compare with manifest</text>
<text class="ts" x="510" y="228" text-anchor="middle" dominant-baseline="central">pinned, overlay or unpinned</text>
</g>
<line x1="300" y1="218" x2="378" y2="218" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="339" y="208" text-anchor="middle">yes</text>
<line x1="170" y1="246" x2="170" y2="274" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="180" y="264" text-anchor="start">no</text>
<rect x="40" y="276" width="260" height="56" rx="8" stroke-width="0.5" class="box"/>
<text class="th" x="170" y="294" text-anchor="middle" dominant-baseline="central">Installed prefix given?</text>
<text class="ts" x="170" y="314" text-anchor="middle" dominant-baseline="central">ELPA, greenX, LibDDLA only</text>
<g class="c-coral"><rect x="380" y="276" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="294" text-anchor="middle" dominant-baseline="central">installed</text>
<text class="ts" x="510" y="314" text-anchor="middle" dominant-baseline="central">Warns: prebuilt may mismatch</text>
</g>
<line x1="300" y1="304" x2="378" y2="304" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="339" y="294" text-anchor="middle">yes</text>
<line x1="170" y1="332" x2="170" y2="360" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="180" y="350" text-anchor="start">no</text>
<g class="c-teal"><rect x="40" y="362" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="380" text-anchor="middle" dominant-baseline="central">Managed source</text>
<text class="ts" x="170" y="400" text-anchor="middle" dominant-baseline="central">thirdparty/src/name-hash</text>
</g>
</svg>
