<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img">
<title>Preparation of a managed third-party source</title>
<desc>LibRPA reuses a prepared tree, or uses a cached or downloaded archive, checks its SHA256, extracts and patches it, and compares the tree hash.</desc>
<style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#F8F7F3;stroke:#888780}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
.head{stroke:#73726C}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}
.c-coral>.th{fill:#712B13}
.c-coral>.ts{fill:#993C1D}
@media (prefers-color-scheme:dark){
.th{fill:#E8E6DF}
.ts{fill:#B4B2A9}
.box{fill:#2C2C2A;stroke:#888780}
.arr,.head{stroke:#9C9A92}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}
.c-teal>.th{fill:#E1F5EE}
.c-teal>.ts{fill:#9FE1CB}
.c-coral>rect{fill:#712B13;stroke:#F0997B}
.c-coral>.th{fill:#FAECE7}
.c-coral>.ts{fill:#F5C4B3}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="200" y="30" width="260" height="56" rx="8" stroke-width="0.5" class="box"/>
<text class="th" x="330" y="48" text-anchor="middle" dominant-baseline="central">Prepared tree exists?</text>
<text class="ts" x="330" y="68" text-anchor="middle" dominant-baseline="central">thirdparty/src/name-hash</text>
<path d="M200 58 L150 58 L150 488 L198 488" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="160" y="50" text-anchor="start">yes</text>
<line x1="330" y1="86" x2="330" y2="114" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="104" text-anchor="start">no</text>
<rect x="200" y="116" width="260" height="56" rx="8" stroke-width="0.5" class="box"/>
<text class="th" x="330" y="134" text-anchor="middle" dominant-baseline="central">Archive in downloads?</text>
<text class="ts" x="330" y="154" text-anchor="middle" dominant-baseline="central">Or LIBRPA_THIRDPARTY_ARCHIVE_DIR</text>
<path d="M200 144 L175 144 L175 402 L198 402" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="178" y="136" text-anchor="start">yes</text>
<line x1="330" y1="172" x2="330" y2="200" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="190" text-anchor="start">no</text>
<rect x="200" y="202" width="260" height="56" rx="8" stroke-width="0.5" class="box"/>
<text class="th" x="330" y="220" text-anchor="middle" dominant-baseline="central">Download allowed?</text>
<text class="ts" x="330" y="240" text-anchor="middle" dominant-baseline="central">LIBRPA_THIRDPARTY_DOWNLOAD</text>
<g class="c-coral"><rect x="490" y="202" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="565" y="220" text-anchor="middle" dominant-baseline="central">Stop</text>
<text class="ts" x="565" y="240" text-anchor="middle" dominant-baseline="central">Prints offline steps</text>
</g>
<line x1="460" y1="230" x2="488" y2="230" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="474" y="220" text-anchor="middle">no</text>
<line x1="330" y1="258" x2="330" y2="286" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="276" text-anchor="start">yes</text>
<rect x="200" y="288" width="260" height="56" rx="8" stroke-width="0.5" class="box"/>
<text class="th" x="330" y="306" text-anchor="middle" dominant-baseline="central">Download the archive</text>
<text class="ts" x="330" y="326" text-anchor="middle" dominant-baseline="central">ARCHIVE_SHA256 must match</text>
<line x1="330" y1="344" x2="330" y2="372" class="arr" marker-end="url(#arrow)"/>
<rect x="200" y="374" width="260" height="56" rx="8" stroke-width="0.5" class="box"/>
<text class="th" x="330" y="392" text-anchor="middle" dominant-baseline="central">Extract, patch, publish</text>
<text class="ts" x="330" y="412" text-anchor="middle" dominant-baseline="central">thirdparty/patches, then rename</text>
<line x1="330" y1="430" x2="330" y2="458" class="arr" marker-end="url(#arrow)"/>
<rect x="200" y="460" width="260" height="56" rx="8" stroke-width="0.5" class="box"/>
<text class="th" x="330" y="478" text-anchor="middle" dominant-baseline="central">Hash the tree</text>
<text class="ts" x="330" y="498" text-anchor="middle" dominant-baseline="central">Compare with TREE_SHA256</text>
<path d="M290 516 L225 554" class="arr" marker-end="url(#arrow)"/>
<path d="M370 516 L435 554" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="120" y="556" width="210" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="225" y="574" text-anchor="middle" dominant-baseline="central">managed</text>
<text class="ts" x="225" y="594" text-anchor="middle" dominant-baseline="central">Matches the pinned tree</text>
</g>
<g class="c-coral"><rect x="350" y="556" width="210" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="455" y="574" text-anchor="middle" dominant-baseline="central">unpinned</text>
<text class="ts" x="455" y="594" text-anchor="middle" dominant-baseline="central">Local edits kept, warns</text>
</g>
</svg>
