<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img">
<title>Status of an explicit third-party path</title>
<desc>The supplied tree is hashed. A match with TREE_SHA256 gives pinned, a match with PRISTINE_SHA256 gives overlay, and any other hash gives unpinned.</desc>
<style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#F8F7F3;stroke:#888780}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
.head{stroke:#73726C}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}
.c-coral>.th{fill:#712B13}
.c-coral>.ts{fill:#993C1D}
@media (prefers-color-scheme:dark){
.th{fill:#E8E6DF}
.ts{fill:#B4B2A9}
.box{fill:#2C2C2A;stroke:#888780}
.arr,.head{stroke:#9C9A92}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}
.c-teal>.th{fill:#E1F5EE}
.c-teal>.ts{fill:#9FE1CB}
.c-coral>rect{fill:#712B13;stroke:#F0997B}
.c-coral>.th{fill:#FAECE7}
.c-coral>.ts{fill:#F5C4B3}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="190" y="30" width="300" height="56" rx="8" stroke-width="0.5" class="box"/>
<text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">Hash the supplied tree</text>
<text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">Missing marker file stops configure</text>
<path d="M260 86 L130 140" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="86" x2="340" y2="140" class="arr" marker-end="url(#arrow)"/>
<path d="M420 86 L550 140" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="142" width="180" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="162" text-anchor="middle" dominant-baseline="central">pinned</text>
<text class="ts" x="130" y="182" text-anchor="middle" dominant-baseline="central">= TREE_SHA256</text>
<text class="ts" x="130" y="200" text-anchor="middle" dominant-baseline="central">Use the path as is</text>
</g>
<g class="c-teal"><rect x="250" y="142" width="180" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="162" text-anchor="middle" dominant-baseline="central">overlay</text>
<text class="ts" x="340" y="182" text-anchor="middle" dominant-baseline="central">= PRISTINE_SHA256</text>
<text class="ts" x="340" y="200" text-anchor="middle" dominant-baseline="central">Patch a copy in src</text>
</g>
<g class="c-coral"><rect x="460" y="142" width="180" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="550" y="162" text-anchor="middle" dominant-baseline="central">unpinned</text>
<text class="ts" x="550" y="182" text-anchor="middle" dominant-baseline="central">Any other hash</text>
<text class="ts" x="550" y="200" text-anchor="middle" dominant-baseline="central">Use as is, warn</text>
</g>
</svg>
