  - heading: QSGW
    text: |
      These experimental driver parameters apply only to `task = qsgw` or
      `task = qsgw_band`. Same-grid analytic head-only updates are enabled
      with `replace_w_head = true` and `option_dielect_func = 4`.
      The aligned velocity remains in the immutable `mf0` basis while live
      eigenvalues and eigenvectors are updated after each diagonalization.
      Independent-grid head/wing and Hartree updates are not supported.
      Linear mixing is regression-tested for molecular QSGW only; the
      current solid-state benchmark uses `qsgw_mixer = none`.
      Full Vxc matrices are read directly using the producer's spin and
      k-point filenames under `input_dir`. Standard ABACUS `out_mat_xc`
      output is already in the initial KS-state basis, so the default
      `qsgw_vxc_basis = state` applies despite its `_nao` filename suffix.
      Use `qsgw_vxc_basis = nao` only for genuine ABACUS AO matrices.
    fields:
      - driver.prefix_vxc_scf
      - driver.prefix_vxc_band
      - driver.qsgw_vxc_basis
      - driver.qsgw_mixer
      - driver.qsgw_mixing_beta
      - driver.qsgw_min_iter
      - driver.qsgw_max_iter
      - driver.qsgw_band0_unoccupied_keep
      - driver.qsgw_band0_cut_mode
      - driver.qsgw_band0_cut_shift_ha
      - driver.qsgw_write_iteration_matrices
      - driver.qsgw_convergence_tolerance_ev

