name: CI

# Schedule checks and build jobs in dependency order.
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Cancel a pull request run when a new commit arrives. On master, a run that
# started does not stop, and the next run waits in a queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tier:
    name: Risk tier
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/risk-tier.yml

  checks:
    name: Checks
    needs: tier
    # A push has no PR description, so a skipped tier permits the next jobs.
    if: >-
      ${{ !cancelled() && (needs.tier.result == 'success' ||
          (github.event_name == 'push' && needs.tier.result == 'skipped')) }}
    uses: ./.github/workflows/checks.yml

  changes:
    name: Build selection
    permissions:
      contents: read
      actions: read
    needs: tier
    if: >-
      ${{ !cancelled() && (needs.tier.result == 'success' ||
          (github.event_name == 'push' && needs.tier.result == 'skipped')) }}
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the changes need a build
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python utilities/check_ci_changes.py >> "$GITHUB_OUTPUT"

  oneapi:
    name: oneAPI
    needs: [checks, changes]
    # Override the implicit success() because tier is skipped on push.
    if: >-
      ${{ !cancelled() && needs.checks.result == 'success' &&
          needs.changes.result == 'success' && needs.changes.outputs.build == 'true' }}
    uses: ./.github/workflows/ci-oneapi.yml

  # The only check that branch rules require. A skipped reusable workflow
  # reports no check under its job names, so the rules cannot require those.
  result:
    name: CI result
    needs: [tier, checks, changes, oneapi]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the results of the required jobs
        env:
          EVENT: ${{ github.event_name }}
          TIER: ${{ needs.tier.result }}
          CHECKS: ${{ needs.checks.result }}
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.changes.outputs.build }}
          ONEAPI: ${{ needs.oneapi.result }}
        run: |
          echo "tier=$TIER checks=$CHECKS changes=$CHANGES build=$BUILD oneapi=$ONEAPI"
          status=0
          if [[ "$TIER" != success && ! ( "$EVENT" == push && "$TIER" == skipped ) ]]; then
            echo "::error::Risk tier did not pass"; status=1
          fi
          [[ "$CHECKS" == success ]] || { echo "::error::Checks did not pass"; status=1; }
          [[ "$CHANGES" == success ]] || { echo "::error::Build selection did not pass"; status=1; }
          if [[ "$BUILD" == true && "$ONEAPI" != success ]]; then
            echo "::error::The oneAPI build did not pass"; status=1
          fi
          exit $status
